# 시옷 클라우드 — 계획 §2 a(A1): 앱 1개(API·릴레이·웹훅 워커·PWA), nrt, 자동 정지 없음, 최소 1대.
# secrets(fly secrets set): DATABASE_URL SESSION_SECRET DATA_ENC_KEY LABEL_MASTER_KEY ALERT_WEBHOOK_URL — .env.example 참고.
app = "siot-cloud"
primary_region = "nrt"
kill_signal = "SIGTERM"
kill_timeout = "15s"

[build]
  dockerfile = "Dockerfile"

[deploy]
  # 빈 DB 에서도 성공해야 한다(B1). 실패하면 배포 중단
  release_command = "node --import tsx src/db/migrate.ts"

[env]
  NODE_ENV = "production"
  PORT = "8080"
  HOST = "0.0.0.0"
  LOG_LEVEL = "info"
  APP_ORIGIN = "https://siot-cloud.fly.dev"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  # GW WebSocket 은 장기 연결 → 연결 수 기준
  [http_service.concurrency]
    type = "connections"
    soft_limit = 2000
    hard_limit = 2500

  [[http_service.checks]]
    grace_period = "20s"
    interval = "15s"
    method = "GET"
    path = "/healthz"
    timeout = "5s"

[checks]
  [checks.healthz]
    type = "http"
    port = 8080
    path = "/healthz"
    interval = "15s"
    timeout = "5s"
    grace_period = "20s"

[metrics]
  port = 8080
  path = "/metrics"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
