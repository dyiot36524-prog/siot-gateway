# 시옷 Matter/Thread 게이트웨이 (Raspberry Pi 5 + ZBT-2)
# 사용 전: cp .env.example .env 후 ZBT2_DEV, BACKBONE_IF 확인. install.sh 가 자동으로 채운다.
# 이미지 3종은 .env 의 OTBR_IMAGE / MATTER_IMAGE / AGENT_IMAGE 로 바꾼다(OTA 대상). 서드파티 2종은 digest 고정이 기본이라
# 부팅 때 pull 없이(인터넷 없이) 기동된다(host/matter-gateway.service: up -d --pull missing).
services:
  otbr:
    # openthread/border-router 는 s6 기반 이미지로 환경변수(OT_*)로 설정한다. 명령 인자를 주면 안 된다.
    # digest 고정(Pi 에서 실행 중이던 v2026.10.0 이미지). 갱신은 .env OTBR_IMAGE 로
    image: ${OTBR_IMAGE:-openthread/border-router@sha256:70d2260eb5022f4c40be4f50195a1952d49041fc766fb3b2f213b06dcdc31a18}
    container_name: otbr
    restart: unless-stopped
    network_mode: host            # 보더 라우팅/mDNS 때문에 host 필수
    cap_add: [NET_ADMIN]
    devices:
      - ${ZBT2_DEV:-/dev/ttyACM0}:/dev/ttyACM0
      - /dev/net/tun:/dev/net/tun
    # 주의: network_mode: host 에서는 컨테이너 sysctls(net.*) 를 Docker 가 거부한다.
    #       포워딩/accept_ra 는 host/99-matter-thread.conf(호스트 sysctl) 에서 설정한다.
    environment:
      OT_RCP_DEVICE: "spinel+hdlc+uart:///dev/ttyACM0?uart-baudrate=460800"   # ZBT-2 OpenThread RCP 펌웨어 기본 보율
      # 인프라 인터페이스 기본 siot0(더미, host/siot-infra.service): 공유기·LAN 케이블 없이도 Thread 기기가 기억하는 Pi 주소가 유지된다(HANDOFF §9c)
      OT_INFRA_IF: ${BACKBONE_IF:-siot0}
      OT_THREAD_IF: wpan0
      OT_LOG_LEVEL: "5"
      OT_REST_LISTEN_ADDR: 127.0.0.1
      OT_REST_LISTEN_PORT: "8081"
    volumes:
      - ./data/otbr:/data
    # 웹 GUI: http://<pi>:80 , REST: http://127.0.0.1:8081 (에이전트가 데이터셋 자동 등록에 사용)

  matter:
    # digest 고정(Pi 에서 실행 중이던 stable 이미지). 갱신은 .env MATTER_IMAGE 로(태그 대신 @sha256 digest 사용)
    image: ${MATTER_IMAGE:-ghcr.io/matter-js/matterjs-server@sha256:54232d0d3e7dff5a54759469d2753399270412b4c30c55b31750a4595e4cb236}
    container_name: matterjs-server
    restart: unless-stopped
    network_mode: host
    depends_on: [otbr]
    environment:
      LOG_LEVEL: info
      PRIMARY_INTERFACE: ${BACKBONE_IF:-siot0}   # OTBR 인프라 인터페이스와 같아야 Thread 기기가 Pi 를 이 인터페이스 주소로 찾는다
      LISTEN_ADDRESS: 127.0.0.1          # 에이전트만 접근. 대시보드 보려면 ,${BACKBONE_IF} 추가
      PRODUCTION_MODE: "true"
      VENDOR_ID: "65521"                 # 테스트 VID 0xFFF1. 반드시 10진수! (matter-server 1.4.0 은 parseInt(v,10) 이라 "0xfff1" → 0 이 되어
                                         #  패브릭 adminVendorId=0 → 기기가 AddNOC 를 INVALID_COMMAND(0x85) 로 거부함). 상용은 CSA 발급 VID
      FABRIC_ID: "1"
      NOBLE_BINDINGS: dbus               # 호스트 BlueZ 사용 (root 불필요)
      BLUETOOTH_ADAPTER: "0"
      TZ: Asia/Seoul
    volumes:
      - ./data/matter:/data
      - /run/dbus:/run/dbus:ro
      # BLE 연결 재시도 백포트 (host/patches/matterjs-server/NobleBleChannel.js 머리말 참고). matter.js > 0.17.9 이미지에서는 제거
      - ./host/patches/matterjs-server/NobleBleChannel.js:/app/node_modules/@matter/nodejs-ble/dist/esm/NobleBleChannel.js:ro
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:5580/"]   # 이미지에 wget 없음, curl 있음
      interval: 30s
      timeout: 5s
      retries: 5

  agent:
    build: ./agent
    # 출고: ghcr.io/dyiot36524-prog/siot-gateway-agent@sha256:... (OTA 가 .env AGENT_IMAGE 를 바꾼다). 개발: 로컬 빌드
    image: ${AGENT_IMAGE:-siot-matter-agent:local}
    container_name: gateway-agent
    restart: unless-stopped
    network_mode: host                   # mDNS(_siot._tcp) + LAN 3000 + loopback 3001
    depends_on: [matter]
    environment:
      SIOT_MODE: ${SIOT_MODE:-production}   # production: LAN 3000 은 상태만, 전체 API 는 127.0.0.1:3001. dev: 기존 단일 서버
      PORT: "3000"
      LOCAL_ADMIN_PORT: "3001"
      SIOT_GATEWAY_VERSION: ${SIOT_GATEWAY_VERSION:-0.2.0}   # 이미지에 SIOT_AGENT_VERSION 이 구워져 있으면 그것이 우선
      SIOT_DATA_DIR: /app/data
      SIOT_RELAY_URL: ${SIOT_RELAY_URL:-}  # 비우면 wss://siot-cloud.fly.dev/gateway, off 면 비활성
      HEALTH_DIR: /app/state/health
      SIOT_SERIAL_FILE: /host/serial-number
      SIOT_MACHINE_ID_FILE: /host/machine-id
      MATTER_BACKEND: ${MATTER_BACKEND:-server}
      MATTER_WS_URL: ws://127.0.0.1:5580/ws
      PAIRING_MAX_ATTEMPTS: ${PAIRING_MAX_ATTEMPTS:-3}   # BLE 링크 실패 시 커미셔닝 재시도 횟수
      OTBR_REST_URL: http://127.0.0.1:8081
      RULES_FILE: /app/data/rules.json   # 없으면 이미지의 /app/rules.example.json 을 최초 1회 복사(install.sh 는 기존 ./rules.json 을 이관)
      DATA_DIR: /app/data
      LOG_LEVEL: ${LOG_LEVEL:-info}
      TZ: Asia/Seoul
    volumes:
      - ./data/agent:/app/data
      # 신뢰 경계(계획 §2 d): state/ 전체가 아니라 아래 3개만. .env·/var/lib/siot 는 마운트하지 않는다
      - ./state/requests:/app/state/requests          # 쓰기: OTA/ctl 요청 큐
      - ./state/health:/app/state/health              # 쓰기: health.json(원자적 rename 을 위해 디렉터리 단위)
      - ./state/out:/app/state/out:ro                 # 읽기 전용: 호스트 스크립트 결과
      - /sys/firmware/devicetree/base/serial-number:/host/serial-number:ro   # gatewayId 결정적 생성용
      - /etc/machine-id:/host/machine-id:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/healthz"]
      interval: 30s
      timeout: 5s
      retries: 5

  # ---- 선택지 C: matter.js 직접 임베드 (matter 컨테이너 대신) ----
  # 실행: docker compose stop matter agent && docker compose --profile embedded up -d --build agent-embedded
  agent-embedded:
    build:
      context: ./agent
      dockerfile: Dockerfile.embedded
    image: siot-matter-agent-embedded:local
    container_name: gateway-agent-embedded
    profiles: [embedded]
    restart: unless-stopped
    network_mode: host
    privileged: true                 # BLE HCI 소켓(noble) 접근용
    depends_on: [otbr]
    environment:
      SIOT_MODE: ${SIOT_MODE:-production}
      PORT: "3000"
      LOCAL_ADMIN_PORT: "3001"
      SIOT_GATEWAY_VERSION: ${SIOT_GATEWAY_VERSION:-0.2.0}
      SIOT_DATA_DIR: /app/data
      SIOT_RELAY_URL: ${SIOT_RELAY_URL:-}
      HEALTH_DIR: /app/state/health
      SIOT_SERIAL_FILE: /host/serial-number
      SIOT_MACHINE_ID_FILE: /host/machine-id
      MATTER_BACKEND: embedded
      MATTER_BLE: "1"
      MATTER_BLE_HCI: "0"
      MATTER_INTERFACE: ${BACKBONE_IF:-siot0}
      MATTER_VENDOR_ID: "65521"      # 0xFFF1 테스트 VID
      OTBR_REST_URL: http://127.0.0.1:8081
      RULES_FILE: /app/data/rules.json
      DATA_DIR: /app/data
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      - ./data/agent:/app/data
      - ./state/requests:/app/state/requests
      - ./state/health:/app/state/health
      - ./state/out:/app/state/out:ro
      - /sys/firmware/devicetree/base/serial-number:/host/serial-number:ro
      - /etc/machine-id:/host/machine-id:ro
      - /var/run/dbus:/var/run/dbus:ro
