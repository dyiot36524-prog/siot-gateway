# /etc/sysctl.d/99-matter-thread.conf
# OTBR(forwarding=1)과 Matter 컨트롤러를 같은 호스트에 둘 때 필요한 값
net.ipv4.ip_forward = 1
net.ipv6.conf.all.forwarding = 1
net.ipv6.conf.all.disable_ipv6 = 0
net.ipv6.conf.all.accept_ra = 2
net.ipv6.conf.all.accept_ra_rt_info_max_plen = 64
net.ipv6.conf.default.accept_ra = 2
net.ipv6.conf.default.accept_ra_rt_info_max_plen = 64
net.ipv6.conf.eth0.accept_ra = 2
net.ipv6.conf.eth0.accept_ra_rt_info_max_plen = 64
net.ipv6.conf.wlan0.accept_ra = 2
net.ipv6.conf.wlan0.accept_ra_rt_info_max_plen = 64
# siot0: 더미 인프라 인터페이스(host/siot-infra.service). OTBR 가 보내는 RA 로 SLAAC 주소를 받는다(forwarding=1 이라 accept_ra=2 필요)
net.ipv6.conf.siot0.accept_ra = 2
net.ipv6.conf.siot0.accept_ra_rt_info_max_plen = 64
net.ipv6.conf.siot0.forwarding = 1
# 배터리(슬리피) Thread 장치의 UDP 흐름이 conntrack 에서 끊기지 않도록
net.netfilter.nf_conntrack_udp_timeout_stream = 3600
